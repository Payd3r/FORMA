version: "3.9"

services:
  fitness-web:
    image: fitness-pwa:latest
    build: .
    container_name: fitness-pwa
    restart: unless-stopped
    networks:
      - web-proxy
    # No ports exposed here; Nginx Proxy Manager (or other reverse proxy)
    # on the shared "web-proxy" network can route traffic to this container on port 80.

  fitness-api:
    image: fitness-api:latest
    build: ./server
    container_name: fitness-api
    restart: unless-stopped
    environment:
      - PORT=3001
      - DB_PATH=/data/fitness.db
      - SERVICE_API_TOKEN=${SERVICE_API_TOKEN:-}
    volumes:
      - ./server/data:/data
    ports:
      - "3001:3001"
    networks:
      - web-proxy

  sqlite-web:
    image: coleifer/sqlite-web:latest
    container_name: fitness-sqlite-web
    restart: unless-stopped
    ports:
      - "8087:8080"
    volumes:
      - ./server/data:/data
    environment:
      - SQLITE_DATABASE=fitness.db
    networks:
      - web-proxy

networks:
  web-proxy:
    external: true
